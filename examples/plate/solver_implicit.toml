# Flat plate, implicit Backward Euler variant of solver.toml.
# The linear system (5x5 blocks, one per cell pair) is assembled natively from
# the mesh and solved by distributed BiCGSTAB + hybrid SGS.
#
# Same physics/numerics as solver.toml; only [time] differs.

[flow]
flow_model = "VISCOUS_FLOW"
prandtl = 0.71
eos = "IDEAL_GAS"
gamma = 1.4
gas_constant = 287.052874

[initial]
rho = 0.18177
pressure = 5590.34
velocity = [622.13, 0.0, 0.0]

[numerics]
flux = "HLLC"
reconstruction = "MUSCL"
limiter = "VENKAT"
venkat_k = 0.5
gradient = "GREEN_GAUSS_FACE"

[time]
scheme = "BACKWARD_EULER"
cfl = 15.0
max_iterations = 10000
residual_tolerance = 1.0e-10

[output]
directory = "out/plate_implicit"
field_interval = 2500
residual_interval = 500

[linalg]
solver = "BICGSTAB"
preconditioner = "SGS"
rel_tol = 1e-1
abs_tol = 1e-15
max_iter = 100
verbosity = "Silent"
